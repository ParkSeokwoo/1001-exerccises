<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1001 체스 전술 트레이너</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">1001 Exercises · Tactical Study</p>
          <h1 id="page-title">체스 전술 문제집을 웹에서 풀어보세요</h1>
          <p class="hero-copy">
            테마별로 분류된 전술 문제를 선택하고, 답안을 숨긴 채 고민한 다음,
            FEN으로 바로 Chess.com 분석 보드에서 이어서 검토할 수 있습니다.
          </p>
        </div>
        <div class="hero-card" aria-label="학습 진행 현황">
          <span id="progress-count">0 / 0</span>
          <small>현재 분류의 진행도</small>
        </div>
      </section>

      <section class="controls" aria-label="문제 분류 선택">
        <label for="category-select">분류</label>
        <select id="category-select"></select>
        <button id="reset-category" type="button" class="secondary">처음 문제로</button>
      </section>

      <section class="trainer-grid">
        <article class="board-card" aria-label="체스 보드">
          <div id="board" class="board" role="img" aria-label="현재 전술 문제의 체스판"></div>
          <p id="side-to-move" class="side-to-move"></p>
        </article>

        <article class="puzzle-card" aria-live="polite">
          <div class="puzzle-meta">
            <span id="puzzle-category" class="pill"></span>
            <span id="puzzle-difficulty" class="pill muted"></span>
          </div>
          <h2 id="puzzle-title"></h2>
          <p id="puzzle-goal" class="goal"></p>

          <dl class="fen-block">
            <dt>FEN</dt>
            <dd id="puzzle-fen"></dd>
          </dl>

          <div id="answer-panel" class="answer-panel" hidden>
            <h3>정답 수순</h3>
            <ol id="answer-lines"></ol>
            <p id="answer-note"></p>
          </div>

          <div class="button-row">
            <button id="show-answer" type="button">답안 보기</button>
            <button id="next-puzzle" type="button" class="secondary">다음 문제</button>
            <a id="analysis-link" class="analysis-link" target="_blank" rel="noopener noreferrer">Chess.com에서 분석</a>
          </div>
        </article>
      </section>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
